<section class="requirements-layout">
  <h2>Requerimientos</h2>
  <nav class="requirements-nav">
    <a routerLink="create" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Crear
    </a>

    <a routerLink="my-requeriments" routerLinkActive="active"> Mis requerimientos </a>

    @if (isAgent || isSuperAdmin) {
      <a routerLink="area-requirements" routerLinkActive="active"> Requerimientos del Área </a>
    }

    @if (isSuperAdmin) {
      <a routerLink="reports" routerLinkActive="active"> Reportes </a>
    }

    <a routerLink="agents" routerLinkActive="active"> Agentes </a>
  </nav>

  <div class="requirements-content">
    <router-outlet />
  </div>
</section>
